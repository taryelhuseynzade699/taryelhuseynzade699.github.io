name: VS Code Server & Antigravity Environment

on:
  workflow_dispatch: # Bu düymə vasitəsilə serveri istədiyiniz vaxt əllə (manually) başladacaqsınız

jobs:
  run-server:
    runs-on: ubuntu-26.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Antigravity CLI və SDK Quraşdır
        run: |
          sudo apt update
          sudo apt upgrade
          echo "Antigravity CLI quraşdırılır..."
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.antigravity/bin" >> $GITHUB_PATH

      - name: VS Code Server Action
        uses: stateful/vscode-server-action@v1.2.0
