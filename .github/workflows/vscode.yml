name: VS Code Server & Antigravity Environment

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-26.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@main

      # 2. ADDIM: Antigravity CLI-ni rəsmi GitHub Action vasitəsilə quraşdırın
      - name: Setup Google Antigravity CLI
        uses: google-antigravity/setup-antigravity@v1
        with:
          version: 'latest'

      # 3. ADDIM: VS Code CLI-ni Yüklə
      - name: VS Code CLI-ni Yüklə
        run: |
          curl -Lk 'https://visualstudio.com' --output vscode_cli.tar.gz
          tar -xf vscode_cli.tar.gz

      # 4. ADDIM: VS Code Tunnel və Antigravity Mühitini Başlat
      - name: VS Code Tunnel və Antigravity Mühitini Başlat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "VS Code Server tuneli başladılır..."
          ./code tunnel --accept-server-license-terms --name github-actions-dev-env
