name: Releases

on: 
  push:
    tags:
    - '*'

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7.0.0
    - uses: ncipollo/release-action@v1.21.0
      with:
        artifacts: "release.tar.gz,foo/*.txt"
        bodyFile: "body.md"
