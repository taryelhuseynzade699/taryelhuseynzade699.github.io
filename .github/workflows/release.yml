name: Create Automated Release

on:
  push:
    tags:
      - 'v*' # Triggers on v1, v1.2, v1.2.3, etc.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial permission to allow creating a release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true # Automatically extracts PR summaries & contributors
