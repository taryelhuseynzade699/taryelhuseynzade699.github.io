<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayatı kürd muğamı - Taryel Hüseynzadə</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        .video-wrapper {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo"><a href="../index.html" style="text-decoration: none; color: white;">Taryel Hüseynzadə</a></div>
    </header>

    <section class="section" style="padding-top: 120px;">
        <div class="video-wrapper">
            <h2 class="section-title">Bayatı kürd muğamı</h2>
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/9kLzT0T1mxM" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div style="text-align: center; margin-top: 30px;">
                <a href="../index.html#videolar" class="btn">Geri qayıt</a>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Taryel Hüseynzadə. Bütün hüquqlar qorunur.</p>
        <p>Sayt GitHub Pages tərəfindən yayımlanır.</p>
    </footer>
</body>
</html>
