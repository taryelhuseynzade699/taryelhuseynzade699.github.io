query ListAllSkills @auth(level: PUBLIC, insecureReason: "This operation is safe to expose to the public") {
  skills {
    id
    name
    category
    owner {
      id
      name
    }
  }
}

mutation CreateNewProject($title: String!, $description: String!) @auth(level: USER, insecureReason: "This operation is safe to expose to all logged in users.") {
  project_insert(
    data: {
      title: $title,
      description: $description,
      createdAt_expr: "request.time",
      updatedAt_expr: "request.time",
      ownerId_expr: "auth.uid"
    }
  ) {
    id
  }
}

query GetMyExperiences @auth(level: USER, insecureReason: "This operation is safe to expose to all logged in users.") {
  experiences(where: { ownerId: { eq_expr: "auth.uid" } }) {
    id
    title
    organization
    startDate
    endDate
    description
    location
  }
}

mutation UpdateUserBio($bio: String!) @auth(level: USER, insecureReason: "This operation is safe to expose to all logged in users.") {
  user_update(
    key: { id_expr: "auth.uid" },
    data: {
      bio: $bio,
      updatedAt_expr: "request.time"
    }
  ) {
    id
  }
}